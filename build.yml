name: Build ROM

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make pkg-config libpng-dev

      - name: Install RGBDS 0.6.1
        run: |
          wget -q https://github.com/gbdev/rgbds/releases/download/v0.6.1/rgbds-0.6.1-linux-x86_64.tar.gz
          tar -xzf rgbds-0.6.1-linux-x86_64.tar.gz
          sudo install -m 755 rgbasm rgblink rgbfix rgbgfx /usr/local/bin/

      - name: Build ROM
        run: make personal -j$(nproc)

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Personal-Pokemon-Kanto-Expansion-Pak
          path: Personal-Pokemon-Kanto-Expansion-Pak.gb
          if-no-files-found: error
